id: https://debrief.info/schemas/stac-extension
name: stac-extension
title: Debrief STAC Extension Properties
description: >
  STAC extension properties for Debrief maritime tactical analysis items.
  Defines the debrief: namespace properties stored in item.properties for
  vessel classification, tags, track metadata, and nationalities.
  These properties enable discovery and filtering in the STAC Stack Browser UI.
  Author is derived from PROV lineage, not stored here (see R7).

  ID Convention: STAC item IDs must use only lowercase letters, digits,
  underscores, and hyphens (pattern: [a-z0-9_-]+). No uppercase letters,
  spaces, or reserved URI characters (: / ? # @). UUIDs (auto-generated)
  comply by definition. Custom IDs are validated at creation time.

prefixes:
  linkml: https://w3id.org/linkml/
  debrief: https://debrief.info/schemas/

default_prefix: debrief
default_range: string

imports:
  - linkml:types
  - common

classes:
  PlatformRecord:
    description: >
      Fully-resolved metadata for a single platform within a STAC item.
      Produced by save-time resolution merging registry lookups with analyst overrides.
      Only id is required; all other fields may be absent for unregistered platforms.
    attributes:
      id:
        description: Platform identifier (e.g., "NELSON"). Matches platform_id on TrackProperties.
        required: true
      name:
        description: Human-readable platform name (e.g., "HMS Nelson")
        required: false
      nationality:
        description: ISO 3166-1 alpha-2 country code (e.g., GB, US)
        required: false
        pattern: "^[A-Z]{2}$"
      vessel_class:
        description: >
          Full vessel classification path using slash-separated notation
          (e.g., surface/warship/frigate/type23).
        required: false
        pattern: "^[a-z0-9-]+(/[a-z0-9-]+){0,3}$"
      vessel_type:
        description: Vessel type — leaf of classification path (e.g., type23)
        required: false
        pattern: "^[a-z0-9-]+$"
      vessel_role:
        description: Vessel role — parent of leaf in classification path (e.g., frigate)
        required: false
        pattern: "^[a-z0-9-]+$"
      domain:
        description: Top-level vessel domain classification
        range: VesselDomainEnum
        required: false

  StacExtensionProperties:
    description: >
      Extension properties added to STAC item.properties under the debrief: namespace.
      All properties are optional — existing items without extension properties remain valid.
      These properties enable filtering, searching, and colour-coding in the Discovery UI.
    attributes:
      platforms:
        description: >
          Fully-resolved per-platform metadata array. Each entry represents one
          platform in the plot with merged registry + override data.
        range: PlatformRecord
        multivalued: true
        required: false
        inlined_as_list: true
        slot_uri: debrief:platforms

      tags:
        description: >
          Plot-level tags — free-text labels applied to the entire plot by the analyst.
          Trimmed non-empty strings with no duplicates.
        range: string
        multivalued: true
        required: false
        slot_uri: debrief:tags

      feature_tags:
        description: >
          Union of all feature-level tags from the plot's GeoJSON features.
          Aggregated at item level for discoverability. Authoritative per-feature
          tags remain in each GeoJSON feature's properties.
        range: string
        multivalued: true
        required: false
        slot_uri: debrief:feature_tags

  PlotTimeExtent:
    description: >
      Temporal extent of a plot expressed as ISO 8601 strings.
      Used within PlotSummary and StacItemSummary for lightweight display
      without the full epoch+iso dual representation of TimeInstant.
    attributes:
      start:
        description: Start of time extent (ISO 8601)
        range: string
        required: true
      end:
        description: End of time extent (ISO 8601)
        range: string
        required: true

  PlotSummary:
    description: >
      Projection of a STAC Item for UI consumption (e.g., browser tree rows).
      Carries only the fields required for listing and opening a plot, derived
      from the STAC Item plus its debrief: extension properties.
      Replaces the Plot interface from apps/vscode/src/types/plot.ts as the
      canonical summary type.
    attributes:
      id:
        description: STAC Item ID
        range: string
        required: true
      title:
        description: Plot title from STAC metadata
        range: string
        required: true
      datetime:
        description: Creation/capture timestamp (ISO 8601)
        range: string
        required: true
      item_path:
        description: Path to item.json relative to store root
        range: string
        required: true
      catalog_id:
        description: Parent catalog identifier
        range: string
        required: true
      source_path:
        description: Original source file path (for provenance)
        range: string
        required: false
      bbox:
        description: Geographic bounding box as [west, south, east, north]
        range: float
        multivalued: true
        required: false
        minimum_cardinality: 4
        maximum_cardinality: 4
      time_extent:
        description: Temporal extent of the plot (start/end ISO 8601 strings)
        range: PlotTimeExtent
        required: false
      track_count:
        description: Number of tracks in this plot
        range: integer
        required: false
        minimum_value: 0
      location_count:
        description: Number of reference locations in this plot
        range: integer
        required: false
        minimum_value: 0

  StacItemSummary:
    description: >
      Minimal STAC Item projection for browser tree display and metadata filtering.
      Unifies StacItemSummary (apps/vscode/src/types/stac.ts) and
      CatalogOverviewItem (shared/components/src/filter-engine/types.ts) into a
      single canonical summary type that carries both navigation fields and the
      full set of debrief: extension properties needed for filtering.
    attributes:
      id:
        description: STAC Item ID
        range: string
        required: true
      title:
        description: Item title
        range: string
        required: true
      datetime:
        description: Single datetime (ISO 8601) — fallback when start/end not available
        range: string
        required: false
      item_path:
        description: Path to item.json relative to store root
        range: string
        required: true
      catalog_id:
        description: Parent catalog identifier
        range: string
        required: true
      store_id:
        description: Parent store identifier (needed for URI construction)
        range: string
        required: true
      bbox:
        description: Geographic bounding box as [west, south, east, north]
        range: float
        multivalued: true
        required: false
        minimum_cardinality: 4
        maximum_cardinality: 4
      start_datetime:
        description: Range start datetime (ISO 8601)
        range: string
        required: false
      end_datetime:
        description: Range end datetime (ISO 8601)
        range: string
        required: false
      platforms:
        description: >
          Fully-resolved per-platform metadata array for filtering.
          Same structure as StacExtensionProperties.platforms.
        range: PlatformRecord
        multivalued: true
        required: false
        inlined_as_list: true
      tags:
        description: Plot-level tags from debrief:tags
        range: string
        multivalued: true
        required: false
      feature_tags:
        description: Feature-level tags from debrief:feature_tags
        range: string
        multivalued: true
        required: false
