id: https://debrief.info/schemas/debrief
name: debrief
title: Debrief Maritime Analysis Schemas
description: >-
  LinkML schemas for Debrief v4.x maritime tactical analysis platform.
  Defines GeoJSON profile extensions for tracks and reference locations.
  This is a tracer bullet implementation covering core entity types.

prefixes:
  linkml: https://w3id.org/linkml/
  debrief: https://debrief.info/schemas/
  geojson: https://purl.org/geojson/vocab#

default_prefix: debrief
default_range: string

imports:
  - linkml:types
  - common
  - styling
  - geojson
  - annotations
  - tool
  - log-entry
  - system-record
  - stac-extension
  - stac
  - raw-geojson
  - session-state
  - tool-result
  - storyboard
  - mcp

# Root schema imports all modules - no additional classes needed here.
# All entity definitions are in their respective module files:
#   - common.yaml: Enums, base types (TimestampedPosition)
#   - styling.yaml: PointProperties, LineProperties, PolygonProperties, TrackStyle
#   - geojson.yaml: TrackFeature, ReferenceLocation
#   - annotations.yaml: NarrativeEntry, CircleAnnotation, RectangleAnnotation,
#                       LineAnnotation, TextAnnotation, VectorAnnotation
#   - log-entry.yaml: LogEntry, WasGeneratedBy, ParameterValue, TuneAnnotation
#   - system-record.yaml: SystemRecordProperties, SnapshotLinks, BranchRecord
#   - stac-extension.yaml: StacExtensionProperties, PlotSummary, StacItemSummary
#   - session-state.yaml: SessionState, TemporalSlice, SpatialSlice, etc.
#   - tool-result.yaml: ToolResultAnnotations, DatasetEntry, DatasetSeries
