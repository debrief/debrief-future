id: https://debrief.info/schemas/annotations
name: annotations
title: Debrief Annotation Types
description: >-
  Annotation types for REP file special comments (NARRATIVE, CIRCLE, etc.).
  These extend the base GeoJSON Feature pattern with annotation-specific properties.

prefixes:
  linkml: https://w3id.org/linkml/
  debrief: https://debrief.info/schemas/
  geojson: https://purl.org/geojson/vocab#

default_prefix: debrief
default_range: string

imports:
  - linkml:types
  - common
  - styling
  - geojson
  - log-entry

# ============================================================================
# NarrativeEntry - Timestamped log/narrative entries
# ============================================================================

classes:
  NarrativeEntryProperties:
    description: Properties for a NarrativeEntry annotation
    attributes:
      kind:
        description: Feature type discriminator
        range: FeatureKindEnum
        required: true
        equals_string: "NARRATIVE"
      time:
        description: Narrative timestamp (ISO8601)
        range: datetime
        required: true
      text:
        description: Narrative text content
        required: true
      track_id:
        description: Associated track identifier (optional)
      symbol:
        description: Display symbol code from REP file
      style:
        description: Point styling properties for display position
        range: PointProperties
        required: true
      source_file:
        description: Original source file path
      provenance:
        description: PROV-aligned provenance records (append-only log of tool operations)
        range: LogEntry
        multivalued: true
        inlined_as_list: true

  NarrativeEntry:
    description: >-
      GeoJSON Feature for timestamped narrative/log entries.
      Narratives are operator notes associated with a timestamp and optionally a track.
      Geometry is optional (Point for display position, or null).
    attributes:
      type:
        description: GeoJSON type discriminator
        range: string
        required: true
        equals_string: "Feature"
      id:
        description: Unique identifier
        required: true
      geometry:
        description: Optional display position (Point) or null
        range: GeoJSONPoint
        # Note: geometry is optional for narratives
      properties:
        description: Narrative metadata
        range: NarrativeEntryProperties
        required: true

# ============================================================================
# CircleAnnotation - Circular regions
# ============================================================================

  CircleAnnotationProperties:
    description: Properties for a CircleAnnotation
    attributes:
      kind:
        description: Feature type discriminator
        range: FeatureKindEnum
        required: true
        equals_string: "CIRCLE"
      center:
        description: Circle center as [longitude, latitude] for precise reconstruction
        range: float
        multivalued: true
        required: true
        minimum_cardinality: 2
        maximum_cardinality: 2
      radius:
        description: Circle radius in meters for precise reconstruction
        range: float
        required: true
        minimum_value: 0
      label:
        description: Annotation label text
      symbol:
        description: Display symbol code from REP file
      style:
        description: Polygon styling properties for the circle area
        range: PolygonProperties
        required: true
      source_file:
        description: Original source file path
      provenance:
        description: PROV-aligned provenance records (append-only log of tool operations)
        range: LogEntry
        multivalued: true
        inlined_as_list: true

  CircleAnnotation:
    description: >-
      GeoJSON Feature for circle annotations.
      Geometry is a Polygon approximating the circle (vertices at regular intervals).
      Properties contain center and radius for precise reconstruction and smooth rendering.
    attributes:
      type:
        description: GeoJSON type discriminator
        range: string
        required: true
        equals_string: "Feature"
      id:
        description: Unique identifier
        required: true
      geometry:
        description: Circle as Polygon (approximated with vertices, e.g., every 45 degrees)
        range: GeoJSONPolygon
        required: true
      properties:
        description: Circle metadata including center and radius for reconstruction
        range: CircleAnnotationProperties
        required: true

# ============================================================================
# RectangleAnnotation - Rectangular regions
# ============================================================================

  RectangleAnnotationProperties:
    description: Properties for a RectangleAnnotation
    attributes:
      kind:
        description: Feature type discriminator
        range: FeatureKindEnum
        required: true
        equals_string: "RECTANGLE"
      label:
        description: Annotation label text
      symbol:
        description: Display symbol code from REP file
      style:
        description: Polygon styling properties for the rectangle area
        range: PolygonProperties
        required: true
      source_file:
        description: Original source file path
      provenance:
        description: PROV-aligned provenance records (append-only log of tool operations)
        range: LogEntry
        multivalued: true
        inlined_as_list: true

  RectangleAnnotation:
    description: >-
      GeoJSON Feature for rectangle annotations.
      Geometry is a Polygon with 4 corners (plus closing point).
    attributes:
      type:
        description: GeoJSON type discriminator
        range: string
        required: true
        equals_string: "Feature"
      id:
        description: Unique identifier
        required: true
      geometry:
        description: Rectangle as Polygon (4 corners + close)
        range: GeoJSONPolygon
        required: true
      properties:
        description: Rectangle metadata
        range: RectangleAnnotationProperties
        required: true

# ============================================================================
# LineAnnotation - Line segments
# ============================================================================

  LineAnnotationProperties:
    description: Properties for a LineAnnotation
    attributes:
      kind:
        description: Feature type discriminator
        range: FeatureKindEnum
        required: true
        equals_string: "LINE"
      label:
        description: Annotation label text
      symbol:
        description: Display symbol code from REP file
      style:
        description: Line styling properties for the line segment
        range: LineProperties
        required: true
      source_file:
        description: Original source file path
      provenance:
        description: PROV-aligned provenance records (append-only log of tool operations)
        range: LogEntry
        multivalued: true
        inlined_as_list: true

  LineAnnotation:
    description: >-
      GeoJSON Feature for line segment annotations.
      Geometry is a LineString with 2 points (start and end).
    attributes:
      type:
        description: GeoJSON type discriminator
        range: string
        required: true
        equals_string: "Feature"
      id:
        description: Unique identifier
        required: true
      geometry:
        description: Line as LineString (2 points)
        range: GeoJSONLineString
        required: true
      properties:
        description: Line metadata
        range: LineAnnotationProperties
        required: true

# ============================================================================
# TextAnnotation - Text labels at a position
# ============================================================================

  TextAnnotationProperties:
    description: Properties for a TextAnnotation
    attributes:
      kind:
        description: Feature type discriminator
        range: FeatureKindEnum
        required: true
        equals_string: "TEXT"
      text:
        description: Text content to display
        required: true
      symbol:
        description: Display symbol code from REP file
      style:
        description: Point styling properties for the text position marker
        range: PointProperties
        required: true
      source_file:
        description: Original source file path
      provenance:
        description: PROV-aligned provenance records (append-only log of tool operations)
        range: LogEntry
        multivalued: true
        inlined_as_list: true

  TextAnnotation:
    description: >-
      GeoJSON Feature for text annotations at a position.
      Geometry is the Point where text should be displayed.
    attributes:
      type:
        description: GeoJSON type discriminator
        range: string
        required: true
        equals_string: "Feature"
      id:
        description: Unique identifier
        required: true
      geometry:
        description: Text display position
        range: GeoJSONPoint
        required: true
      properties:
        description: Text metadata
        range: TextAnnotationProperties
        required: true

# ============================================================================
# VectorAnnotation - Vector (range/bearing) from a point
# ============================================================================

  VectorAnnotationProperties:
    description: Properties for a VectorAnnotation
    attributes:
      kind:
        description: Feature type discriminator
        range: FeatureKindEnum
        required: true
        equals_string: "VECTOR"
      origin:
        description: Vector origin as [longitude, latitude] for precise reconstruction
        range: float
        multivalued: true
        required: true
        minimum_cardinality: 2
        maximum_cardinality: 2
      range:
        description: Vector length/range in meters for precise reconstruction
        range: float
        required: true
        minimum_value: 0
      bearing:
        description: Vector bearing in degrees (0-360, from north) for precise reconstruction
        range: float
        required: true
        minimum_value: 0
        maximum_value: 360
      label:
        description: Annotation label text
      symbol:
        description: Display symbol code from REP file
      style:
        description: Line styling properties for the vector
        range: LineProperties
        required: true
      source_file:
        description: Original source file path
      provenance:
        description: PROV-aligned provenance records (append-only log of tool operations)
        range: LogEntry
        multivalued: true
        inlined_as_list: true

  VectorAnnotation:
    description: >-
      GeoJSON Feature for vector annotations.
      Geometry is a LineString from origin to endpoint (computed from range/bearing).
      Properties contain origin, range, and bearing for precise reconstruction.
    attributes:
      type:
        description: GeoJSON type discriminator
        range: string
        required: true
        equals_string: "Feature"
      id:
        description: Unique identifier
        required: true
      geometry:
        description: Vector as LineString (origin to computed endpoint)
        range: GeoJSONLineString
        required: true
      properties:
        description: Vector metadata including origin, range, and bearing for reconstruction
        range: VectorAnnotationProperties
        required: true

# ============================================================================
# PolyAnnotation - Arbitrary user-defined polygons
# ============================================================================

  PolyAnnotationProperties:
    description: Properties for a PolyAnnotation
    attributes:
      kind:
        description: Feature type discriminator
        range: FeatureKindEnum
        required: true
        equals_string: "POLY"
      vertex_count:
        description: Number of unique vertices (excluding ring closure point)
        range: integer
        required: true
        minimum_value: 3
      label:
        description: Annotation label text
      symbol:
        description: Display symbol code from REP file
      style:
        description: Polygon styling properties for the polygon area
        range: PolygonProperties
        required: true
      source_file:
        description: Original source file path
      line_number:
        description: Source line number for debugging
        range: integer
      provenance:
        description: PROV-aligned provenance records (append-only log of tool operations)
        range: LogEntry
        multivalued: true
        inlined_as_list: true

  PolyAnnotation:
    description: >-
      GeoJSON Feature for arbitrary polygon annotations.
      Geometry is a Polygon with user-defined vertices (freeform shape).
      Used for patrol zones, exclusion areas, search grids, etc.
    attributes:
      type:
        description: GeoJSON type discriminator
        range: string
        required: true
        equals_string: "Feature"
      id:
        description: Unique identifier
        required: true
      geometry:
        description: Polygon with user-defined vertices (closed ring)
        range: GeoJSONPolygon
        required: true
      properties:
        description: Polygon metadata including vertex count and styling
        range: PolyAnnotationProperties
        required: true
