id: https://debrief.com/schemas/tool-result
name: tool-result
description: >
  LinkML schema for Debrief tool result annotations.
  Defines result types, annotations, and validation rules for MCP tool responses.

prefixes:
  linkml: https://w3id.org/linkml/
  debrief: https://debrief.com/
  xsd: http://www.w3.org/2001/XMLSchema#

default_prefix: debrief

imports:
  - linkml:types

enums:
  ResultTopType:
    description: Top-level result type categories
    permissible_values:
      mutation:
        description: Modification of existing features (e.g., track smoothing)
      addition:
        description: Creation of new features (e.g., analysis results)
      deletion:
        description: Removal of features (e.g., outlier deletion)
      artifact:
        description: Non-GeoJSON outputs (e.g., plots, reports)

  ErrorCategory:
    description: Categories of tool execution errors
    permissible_values:
      invalid_input:
        description: User-provided input failed validation
      algorithm_failure:
        description: Algorithm encountered unrecoverable error
      resource_not_found:
        description: Required feature or data not found

classes:
  ResultTypePath:
    description: >
      Slash-delimited hierarchical type path.
      Format: {top_type}/{domain}/{specific_type}
      Example: mutation/track/smoothed
    attributes:
      path:
        description: Full hierarchical path
        range: string
        required: true
        pattern: "^(mutation|addition|deletion|artifact)/[a-z_]+/[a-z_]+$"

  ToolResultAnnotations:
    description: >
      Annotations for MCP tool result content items.
      All results MUST include resultType, sourceFeatures, and label.
      Deletions MUST include deletedFeatures.
      Artifacts MUST include href.
    attributes:
      resultType:
        description: Hierarchical result type (e.g., mutation/track/smoothed)
        range: string
        required: true
        pattern: "^(mutation|addition|deletion|artifact)/[a-z_]+/[a-z_]+$"
        slot_uri: debrief:resultType

      sourceFeatures:
        description: IDs of input features used to generate this result
        range: string
        multivalued: true
        required: true
        minimum_cardinality: 1
        slot_uri: debrief:sourceFeatures

      label:
        description: Human-readable description of the result
        range: string
        required: true
        slot_uri: debrief:label

      href:
        description: Relative path to artifact file (REQUIRED for artifacts)
        range: string
        slot_uri: debrief:href

      deletedFeatures:
        description: IDs of features removed (REQUIRED for deletions)
        range: string
        multivalued: true
        minimum_cardinality: 1
        slot_uri: debrief:deletedFeatures

  DatasetAxisMetadata:
    description: Axis label and type metadata for a dataset chart
    attributes:
      label:
        description: Human-readable axis label (e.g., "Time", "Range")
        range: string
        required: true
      type:
        description: Axis data type (temporal, quantitative)
        range: string
        required: true
      units:
        description: Units for the axis values (e.g., "m", "°")
        range: string

  DatasetMetadata:
    description: Chart metadata for a dataset entry
    attributes:
      xAxis:
        description: X-axis metadata
        range: DatasetAxisMetadata
        required: true
      yAxis:
        description: Y-axis metadata
        range: DatasetAxisMetadata
        required: true

  DatasetDataPoint:
    description: >
      A single structured data record within a series or flat dataset.
      Fields are open-ended (the axes are described by DatasetMetadata) to
      accommodate any combination of x/y/series-key values produced by tools.
      At minimum one of x_value or y_value is expected, but additional
      domain-specific fields (e.g., "zone", "bearing", "time") are allowed.
    attributes:
      x_value:
        description: >
          Primary independent-axis value serialised as a string.
          For temporal axes this is an ISO 8601 datetime; for quantitative axes
          it is a decimal string; for nominal/ordinal axes it is the category label.
        range: string
        required: false
      y_value:
        description: >
          Primary dependent-axis value serialised as a string (decimal or label).
        range: string
        required: false
      series_key:
        description: >
          Series discriminator for multi-series datasets (e.g., track name).
          Absent for single-series (flat) datasets.
        range: string
        required: false

  DatasetSeries:
    description: >
      A named data series within a multi-series dataset.
      Replaces the earlier float[] data field with a list of structured
      DatasetDataPoint records to match the runtime DataSeries shape from
      shared/components/src/ChartRenderer/types.ts (Record<string, unknown>[]).
    attributes:
      name:
        description: Series display name (shown in chart legend)
        range: string
        required: true
      data_points:
        description: >
          Array of structured data records for this series.
          Each record carries open x/y/domain fields; see DatasetDataPoint.
        range: DatasetDataPoint
        multivalued: true
        required: true
        inlined_as_list: true

  DatasetEntry:
    description: >
      Standard envelope for all tool result datasets, matching the runtime
      DatasetEnvelope interface from shared/components/src/ChartRenderer/types.ts.
      Exactly one of data_points (flat/single-series) or series (multi-series)
      should be populated per instance.
    attributes:
      type:
        description: Dataset subtype identifier (e.g., "zone_histogram", "range_bearing_series")
        range: string
        required: true
      title:
        description: Human-readable chart title
        range: string
        required: true
      metadata:
        description: Axis definitions and display hints
        range: DatasetMetadata
        required: true
      data_points:
        description: >
          Flat array of structured data records for histograms and single-series charts.
          Corresponds to DatasetEnvelope.data (Record<string, unknown>[]).
          Absent when series is populated.
        range: DatasetDataPoint
        multivalued: true
        required: false
        inlined_as_list: true
      series:
        description: >
          Named data series for multi-line/multi-series charts.
          Corresponds to DatasetEnvelope.series (DataSeries[]).
          Absent when data_points is populated.
        range: DatasetSeries
        multivalued: true
        required: false
        inlined_as_list: true
