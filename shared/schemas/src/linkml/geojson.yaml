id: https://debrief.info/schemas/geojson
name: geojson
title: Debrief GeoJSON Profile
description: >-
  GeoJSON Feature types for maritime tracks and reference locations.
  Tracer bullet implementation with core entity types only.

prefixes:
  linkml: https://w3id.org/linkml/
  debrief: https://debrief.info/schemas/
  geojson: https://purl.org/geojson/vocab#

default_prefix: debrief
default_range: string

imports:
  - linkml:types
  - common
  - styling
  - log-entry

# ============================================================================
# GeoJSON Geometry Types
# ============================================================================

classes:
  GeoJSONPoint:
    description: GeoJSON Point geometry
    attributes:
      type:
        description: Geometry type discriminator
        range: string
        required: true
        equals_string: "Point"
      coordinates:
        description: "[longitude, latitude] in degrees"
        range: float
        multivalued: true
        required: true
        minimum_cardinality: 2
        maximum_cardinality: 2

  GeoJSONEmptyPoint:
    description: GeoJSON Point geometry with empty coordinates (for non-spatial features)
    attributes:
      type:
        description: Geometry type discriminator
        range: string
        required: true
        equals_string: "Point"
      coordinates:
        description: Empty array for non-spatial features
        range: float
        multivalued: true
        required: true
        maximum_cardinality: 0

  GeoJSONLineString:
    description: GeoJSON LineString geometry
    attributes:
      type:
        description: Geometry type discriminator
        range: string
        required: true
        equals_string: "LineString"
      coordinates:
        description: Array of [longitude, latitude] pairs
        range: float
        multivalued: true
        required: true

  GeoJSONPolygon:
    description: GeoJSON Polygon geometry
    attributes:
      type:
        description: Geometry type discriminator
        range: string
        required: true
        equals_string: "Polygon"
      coordinates:
        description: Array of linear rings (arrays of [lon, lat] pairs)
        range: float
        multivalued: true
        required: true

  GeoJSONMultiPoint:
    description: GeoJSON MultiPoint geometry for reference point sets
    attributes:
      type:
        description: Geometry type discriminator
        range: string
        required: true
        equals_string: "MultiPoint"
      coordinates:
        description: Array of [longitude, latitude] pairs
        range: float
        multivalued: true
        required: true

  GeoJSONMultiLineString:
    description: GeoJSON MultiLineString geometry for compound tracks
    attributes:
      type:
        description: Geometry type discriminator
        range: string
        required: true
        equals_string: "MultiLineString"
      coordinates:
        description: Array of LineString coordinate arrays
        range: float
        multivalued: true
        required: true

  GeoJSONMultiPolygon:
    description: GeoJSON MultiPolygon geometry for multi-polygon tool results
    attributes:
      type:
        description: Geometry type discriminator
        range: string
        required: true
        equals_string: "MultiPolygon"
      coordinates:
        description: Array of polygon coordinate arrays (each an array of linear rings)
        range: float
        multivalued: true
        required: true

# ============================================================================
# Compound Track Embedded Types
# ============================================================================

  SegmentMetadata:
    description: >-
      Per-segment metadata for compound tracks. Each segment corresponds to
      one LineString within a MultiLineString geometry. segments[i] describes
      geometry.coordinates[i].
    attributes:
      segment_type:
        description: Segment type discriminator
        range: SegmentTypeEnum
        required: true
      start_time:
        description: Segment start timestamp (ISO8601)
        range: datetime
        required: true
      end_time:
        description: Segment end timestamp (ISO8601)
        range: datetime
        required: true
      positions:
        description: Per-position metadata (parallel to coordinates)
        range: TimestampedPosition
        multivalued: true
        required: true
        inlined_as_list: true
      name:
        description: Human-readable segment name
      style:
        description: Per-segment line styling override
        range: LineProperties
      course:
        description: Estimated course in degrees (TMA segments)
        range: float
        minimum_value: 0
        maximum_value: 360
      speed:
        description: Estimated speed in knots (TMA segments)
        range: float
        minimum_value: 0
      base_frequency:
        description: Base frequency in Hz (TMA segments)
        range: float
      host_track_id:
        description: ID of track this solution is relative to (RELATIVE_TMA)
      host_sensor_name:
        description: Towed array sensor name (RELATIVE_TMA)
      offset_bearing:
        description: Bearing offset in degrees (RELATIVE_TMA)
        range: float
        minimum_value: 0
        maximum_value: 360
      offset_range:
        description: Range offset in metres (RELATIVE_TMA)
        range: float
        minimum_value: 0
      before_leg:
        description: Name of preceding TMA leg (DYNAMIC_INFILL)
      after_leg:
        description: Name of following TMA leg (DYNAMIC_INFILL)

  MeasuredArrayPosition:
    description: >-
      Timestamped geographic position of a towed array centre.
      Used by MEASURED array centre mode for bearing line origin interpolation.
    attributes:
      time:
        description: Position timestamp (ISO8601)
        range: datetime
        required: true
      location:
        description: Array centre position [longitude, latitude] (GeoJSON coordinate order)
        range: float
        multivalued: true
        required: true
        minimum_cardinality: 2
        maximum_cardinality: 2

  SensorContact:
    description: >-
      Single sensor measurement record. Represents one bearing/range
      observation at a point in time.
    attributes:
      time:
        description: Contact measurement timestamp (ISO8601)
        range: datetime
        required: true
      bearing:
        description: Bearing to contact in degrees (0-360)
        range: float
        required: true
        minimum_value: 0
        maximum_value: 360
      has_bearing:
        description: Controls bearing line display (true=show, false=hide). Data stored regardless.
        range: boolean
      ambiguous_bearing:
        description: Ambiguous bearing (second solution) in degrees
        range: float
        minimum_value: 0
        maximum_value: 360
      has_ambiguous:
        description: Controls ambiguous bearing display
        range: boolean
      range:
        description: Range to contact in metres
        range: float
        minimum_value: 0
      frequency:
        description: Measured frequency in Hz
        range: float
      has_frequency:
        description: Controls frequency data display
        range: boolean
      label:
        description: Display label
      comment:
        description: Operator note
      color:
        description: Contact color override (null = inherit from parent SensorData)
        range: CSSColor
      visible:
        description: Contact visibility
        range: boolean
      show_label:
        description: Label visibility
        range: boolean
      line_style:
        description: Bearing line visual style
        range: LineStyleEnum
      label_location:
        description: Label horizontal alignment
        range: LabelLocationEnum
      put_label_at:
        description: Label position along bearing line
        range: LineLabelPositionEnum
      origin:
        description: Explicit sensor location override [longitude, latitude]
        range: float
        multivalued: true
        minimum_cardinality: 2
        maximum_cardinality: 2

  SensorData:
    description: >-
      Named sensor with contact measurements. Embedded in TrackProperties
      to associate sensor data with the host track.
    attributes:
      name:
        description: Sensor identifier (e.g., "TOWED_ARRAY")
        required: true
      base_frequency:
        description: Reference frequency in Hz
        range: float
      offset:
        description: Sensor offset from host platform in metres
        range: float
      array_centre_mode:
        description: How bearing line origin is calculated relative to host platform
        range: ArrayCentreModeEnum
      worm_in_hole:
        description: Display mode flag
        range: boolean
      color:
        description: Default color for all contacts in this sensor
        range: CSSColor
      visible:
        description: Sensor visibility
        range: boolean
      line_thickness:
        description: Bearing line width in pixels
        range: integer
      contacts:
        description: Array of sensor measurements
        range: SensorContact
        multivalued: true
        required: true
        inlined_as_list: true
      measured_positions:
        description: Actual towed array positions for MEASURED array centre mode
        range: MeasuredArrayPosition
        multivalued: true
        inlined_as_list: true

  TUASolution:
    description: >-
      Single Target Uncertainty Area estimate. Has either absolute
      positioning (centre_lat/centre_lon) or relative positioning
      (bearing/range), plus optional ellipse and kinematics.
    attributes:
      time:
        description: Solution timestamp (ISO8601)
        range: datetime
        required: true
      label:
        description: Solution label
        required: true
      centre_lat:
        description: Absolute latitude (mutual exclusive with bearing/range)
        range: float
      centre_lon:
        description: Absolute longitude (mutual exclusive with bearing/range)
        range: float
      bearing:
        description: Relative bearing from host track in degrees
        range: float
        minimum_value: 0
        maximum_value: 360
      range:
        description: Relative range from host track in metres
        range: float
        minimum_value: 0
      orientation:
        description: Ellipse orientation from north in degrees
        range: float
        minimum_value: 0
        maximum_value: 360
      maxima:
        description: Semi-major axis in metres
        range: float
        minimum_value: 0
      minima:
        description: Semi-minor axis in metres
        range: float
        minimum_value: 0
      course:
        description: Estimated course in degrees
        range: float
        minimum_value: 0
        maximum_value: 360
      speed:
        description: Estimated speed in knots
        range: float
        minimum_value: 0
      depth:
        description: Estimated depth in metres
        range: float

  TUAData:
    description: >-
      Named TUA solution collection. Embedded in TrackProperties to
      associate TUA data with the host track.
    attributes:
      name:
        description: TUA collection name
        required: true
      host_track_name:
        description: Name of track this TUA set relates to
        required: true
      solutions:
        description: Array of TUA estimates
        range: TUASolution
        multivalued: true
        required: true
        inlined_as_list: true

# ============================================================================
# TrackFeature
# ============================================================================

  TrackProperties:
    is_a: BaseFeatureProperties
    description: Properties for a TrackFeature
    attributes:
      kind:
        description: Feature type discriminator
        range: FeatureKindEnum
        required: true
        equals_string: "TRACK"
      platform_id:
        description: Platform/vessel identifier
        required: true
      platform_name:
        description: Human-readable platform name
      track_type:
        description: Type of track
        range: TrackTypeEnum
        required: true
      start_time:
        description: Track start time (ISO8601)
        range: datetime
        required: true
      end_time:
        description: Track end time (ISO8601)
        range: datetime
        required: true
      positions:
        description: Array of timestamped positions
        range: TimestampedPosition
        multivalued: true
        required: true
        minimum_cardinality: 2
      style:
        description: Composite styling for track line and position markers
        range: TrackStyle
        required: true
      default_position_style:
        description: Default styling applied to all positions
        range: PositionStyle
        required: true
      symbol_interval:
        description: >-
          ISO 8601 duration for interval-based symbol display.
          E.g., "PT5M" = every 5 minutes, "PT1H" = every hour.
          Null means no interval-based symbols.
        range: string
        pattern: "^P(T[0-9]+[HMS])+$|^P[0-9]+D(T[0-9]+[HMS]+)?$"
      label_interval:
        description: >-
          ISO 8601 duration for interval-based label display.
          Null means no interval-based labels.
        range: string
        pattern: "^P(T[0-9]+[HMS])+$|^P[0-9]+D(T[0-9]+[HMS]+)?$"
      position_style_overrides:
        description: >-
          Parallel array of per-position style overrides. Same length as positions
          array. Use null entries for positions without custom styling.
        range: PositionStyleOverride
        multivalued: true
      segments:
        description: >-
          Per-segment metadata for compound tracks. When present, geometry MUST
          be MultiLineString and segments[i] describes coordinates[i]. When
          absent, geometry is LineString and the flat positions array is used.
        range: SegmentMetadata
        multivalued: true
        inlined_as_list: true
      sensors:
        description: >-
          Embedded sensor data associated with this track. Each sensor contains
          named metadata and an array of contact measurements.
        range: SensorData
        multivalued: true
        inlined_as_list: true
      tuas:
        description: >-
          Embedded Target Uncertainty Area data associated with this track.
          Each TUA entry is a named collection of time-indexed solutions.
        range: TUAData
        multivalued: true
        inlined_as_list: true
      display_name:
        description: >-
          Human-readable platform display name override.
          When set, overrides the registry-derived name for this track.
        required: false
      nationality:
        description: >-
          ISO 3166-1 alpha-2 country code override (e.g., GB, US).
          When set, overrides the registry-derived nationality.
        required: false
        pattern: "^[A-Z]{2}$"
      vessel_class:
        description: >-
          Full vessel classification path override using slash-separated notation
          (e.g., surface/warship/frigate/type23). When set, overrides registry-derived path.
        required: false
        pattern: "^[a-z0-9-]+(/[a-z0-9-]+){0,3}$"
      vessel_type:
        description: >-
          Vessel type override (leaf of classification path, e.g., type23).
          When set, overrides the registry-derived type.
        required: false
        pattern: "^[a-z0-9-]+$"
      vessel_role:
        description: >-
          Vessel role override (parent of leaf in classification path, e.g., frigate).
          When set, overrides the registry-derived role.
        required: false
        pattern: "^[a-z0-9-]+$"
      domain:
        description: >-
          Vessel domain override. When set, overrides the registry-derived domain.
        range: VesselDomainEnum
        required: false
  TrackFeature:
    description: GeoJSON Feature representing a vessel track
    attributes:
      type:
        description: GeoJSON type discriminator
        range: string
        required: true
        equals_string: "Feature"
      id:
        description: Unique identifier (UUID recommended)
        required: true
      geometry:
        description: Track path as LineString (simple) or MultiLineString (compound)
        required: true
        any_of:
          - range: GeoJSONLineString
          - range: GeoJSONMultiLineString
      properties:
        description: Track metadata
        range: TrackProperties
        required: true
      bbox:
        description: Bounding box [minLon, minLat, maxLon, maxLat]
        range: float
        multivalued: true
        minimum_cardinality: 4
        maximum_cardinality: 4

# ============================================================================
# ReferenceLocation
# ============================================================================

  PointMetadataEntry:
    description: >-
      Metadata for a single point within a MultiPoint reference set.
      Entries are parallel to the MultiPoint coordinates array.
      Downstream tools (#081 classifier) extend entries with zone/color fields.
    attributes:
      index:
        description: 0-based ordinal matching coordinates array position
        range: integer
        required: true
      name:
        description: Human-readable point label (e.g., "Ref 1")
        range: string
        required: true

  ReferenceLocationProperties:
    is_a: BaseFeatureProperties
    description: Properties for a ReferenceLocation
    attributes:
      kind:
        description: Feature type discriminator
        range: FeatureKindEnum
        required: true
        equals_string: "POINT"
      name:
        description: Reference location name
        required: true
      location_type:
        description: Type of reference
        range: LocationTypeEnum
        required: true
      description:
        description: Additional description
      symbol:
        description: Map symbol identifier
      style:
        description: Point styling properties for display
        range: PointProperties
        required: true
      valid_from:
        description: Start of validity period
        range: datetime
      valid_until:
        description: End of validity period
        range: datetime
      point_metadata:
        description: >-
          Per-point metadata array, parallel to MultiPoint coordinates.
          Each entry contains at minimum an index and name.
          Downstream tools extend entries with zone/color fields.
        range: PointMetadataEntry
        multivalued: true
        inlined_as_list: true
  ReferenceLocation:
    description: GeoJSON Feature for fixed reference points or reference point sets
    attributes:
      type:
        description: GeoJSON type discriminator
        range: string
        required: true
        equals_string: "Feature"
      id:
        description: Unique identifier
        required: true
      geometry:
        description: Location (Point) or reference point set (MultiPoint)
        required: true
        any_of:
          - range: GeoJSONPoint
          - range: GeoJSONMultiPoint
      properties:
        description: Reference metadata
        range: ReferenceLocationProperties
        required: true

# ============================================================================
# SystemState (Non-spatial system state features)
# ============================================================================

  SystemStateProperties:
    description: Properties for SYSTEM features storing application state
    attributes:
      kind:
        description: Feature type discriminator
        range: FeatureKindEnum
        required: true
        equals_string: "SYSTEM"
      state_type:
        description: Discriminator for state variant (temporal, spatial, selection, active_storyboard)
        range: SystemStateTypeEnum
        required: true
      # Temporal viewport fields (when state_type = temporal)
      start_time:
        description: Viewport start time (ISO8601) - for temporal state
        range: datetime
      end_time:
        description: Viewport end time (ISO8601) - for temporal state
        range: datetime
      # Spatial viewport fields (when state_type = spatial)
      bbox:
        description: Bounding box [minLon, minLat, maxLon, maxLat] - for spatial state
        range: float
        multivalued: true
      zoom:
        description: Map zoom level - for spatial state
        range: float
      center:
        description: Map center [longitude, latitude] - for spatial state
        range: float
        multivalued: true
      # Selection state fields (when state_type = selection)
      selected_ids:
        description: Array of selected feature IDs - for selection state
        range: string
        multivalued: true
      # Active-storyboard fields (when state_type = active_storyboard)
      active_storyboard_id:
        description: Storyboard properties.id the analyst last pinned for this plot (#237)
        range: string
      provenance:
        description: PROV-aligned provenance records (append-only log of tool operations)
        range: LogEntry
        multivalued: true
        inlined_as_list: true

  SystemState:
    description: GeoJSON Feature for storing non-spatial system state
    attributes:
      type:
        description: GeoJSON type discriminator
        range: string
        required: true
        equals_string: "Feature"
      id:
        description: State identifier (must start with 'state.')
        required: true
        pattern: "^state\\.[a-z]+$"
      geometry:
        description: Point geometry with empty coordinates for SYSTEM features
        range: GeoJSONEmptyPoint
        required: true
      properties:
        description: State-specific properties
        range: SystemStateProperties
        required: true

# ============================================================================
# MultiPointFeature (tool result with MultiPoint geometry)
# ============================================================================

  MultiPointFeatureProperties:
    is_a: BaseFeatureProperties
    description: Properties for a MultiPointFeature (multi-point tool results)
    attributes:
      kind:
        description: Feature type discriminator
        range: FeatureKindEnum
        required: true
        equals_string: "MULTI_POINT"
      label:
        description: Human-readable result label
        required: true
      style:
        description: Point styling for all positions
        range: PointProperties
        required: true
      source_tool:
        description: Name of calculation tool that produced this result
      source_features:
        description: IDs of input features used to generate this result
        range: string
        multivalued: true
      description:
        description: Additional description or notes
  MultiPointFeature:
    description: GeoJSON Feature for multi-point tool results
    attributes:
      type:
        description: GeoJSON type discriminator
        range: string
        required: true
        equals_string: "Feature"
      id:
        description: Unique identifier (UUID recommended)
        required: true
      geometry:
        description: MultiPoint geometry
        range: GeoJSONMultiPoint
        required: true
      properties:
        description: Feature properties and styling
        range: MultiPointFeatureProperties
        required: true
      bbox:
        description: Bounding box [minLon, minLat, maxLon, maxLat]
        range: float
        multivalued: true
        minimum_cardinality: 4
        maximum_cardinality: 4

# ============================================================================
# MultiPolygonFeature (tool result with MultiPolygon geometry)
# ============================================================================

  MultiPolygonFeatureProperties:
    is_a: BaseFeatureProperties
    description: Properties for a MultiPolygonFeature (multi-polygon tool results)
    attributes:
      kind:
        description: Feature type discriminator
        range: FeatureKindEnum
        required: true
        equals_string: "MULTI_POLYGON"
      label:
        description: Human-readable result label
        required: true
      style:
        description: Polygon styling for all regions
        range: PolygonProperties
        required: true
      source_tool:
        description: Name of calculation tool that produced this result
      source_features:
        description: IDs of input features used to generate this result
        range: string
        multivalued: true
      description:
        description: Additional description or notes
  MultiPolygonFeature:
    description: GeoJSON Feature for multi-polygon tool results
    attributes:
      type:
        description: GeoJSON type discriminator
        range: string
        required: true
        equals_string: "Feature"
      id:
        description: Unique identifier (UUID recommended)
        required: true
      geometry:
        description: MultiPolygon geometry
        range: GeoJSONMultiPolygon
        required: true
      properties:
        description: Feature properties and styling
        range: MultiPolygonFeatureProperties
        required: true
      bbox:
        description: Bounding box [minLon, minLat, maxLon, maxLat]
        range: float
        multivalued: true
        minimum_cardinality: 4
        maximum_cardinality: 4
