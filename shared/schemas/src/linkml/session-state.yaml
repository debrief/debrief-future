id: https://debrief.info/schemas/session-state
name: session_state
title: Debrief Session State Schema
description: >-
  LinkML schema for the in-memory session-state store slices used by the
  Debrief frontends (temporal navigation, spatial viewport, feature selection,
  document lifecycle, tool results, browser filter).

  Feature 261 retired the `.debrief-session` sidecar: the persisted
  `SessionFile` / `SessionState` root classes were deleted, and the shared
  value types (Coordinate, ViewportPolygon, TimeInstant/Range/Filter/Step,
  PlaybackStateEnum, DisplayModeEnum, TimeUnitEnum) were consolidated into
  common.yaml (FR-002a). All persisted plot state now lives in
  features.geojson as SystemState features + per-feature `visible` flags.
  The slice classes below describe the in-memory store shape only.

prefixes:
  linkml: https://w3id.org/linkml/
  debrief: https://debrief.info/schemas/

default_prefix: debrief
default_range: string

imports:
  - linkml:types
  - common

# ============================================================================
# Enums
# ============================================================================

enums:
  AddressingMode:
    description: How addresses in a selection path level are interpreted (Feature 053)
    permissible_values:
      id:
        description: Address is a string identifier
      index:
        description: Address is a numeric position index

# ============================================================================
# Core Types
# ============================================================================
# NB: Coordinate, ViewportPolygon, TimeInstant, TimeRange, TimeFilter, TimeStep
# (and the PlaybackStateEnum / DisplayModeEnum / TimeUnitEnum enums) are now
# defined once in common.yaml (feature 261, FR-002a) and referenced here via
# the `common` import above.

classes:

  LevelDefinition:
    description: >-
      Named nesting level within a feature hierarchy (Feature 053, FR-010).
      Defines how addresses at this level are interpreted.
    attributes:
      name:
        description: Level identifier used in selection paths
        range: string
        required: true
      addressingMode:
        description: How addresses at this level are interpreted
        range: AddressingMode
        required: true
      description:
        description: Human-readable description
        range: string

  FeatureSelection:
    description: >-
      Set of selected feature identifiers with metadata (FR-017).
      featureIds accepts selection path strings: forward-slash-separated
      segments following RFC 6901 escaping. A single-segment path is
      a flat feature ID (backward compatible). Feature 053.
    attributes:
      featureIds:
        description: >-
          Selected feature paths. Each entry is a forward-slash-separated
          selection path (e.g. "track-001/positions/4") or a flat feature ID.
        range: string
        multivalued: true
        required: true
      primary:
        description: Primary selection path for properties display
        range: string
      timestamp:
        description: When selection was made
        range: TimeInstant
        required: true

# ============================================================================
# State Slices (in-memory store shape; not persisted as-is — see feature 261)
# ============================================================================

  TemporalSlice:
    description: Time-related state including navigation, playback, and filtering
    attributes:
      currentTime:
        description: Current playback/display time (FR-005)
        range: TimeInstant
      timeRange:
        description: Full temporal extent of loaded data (FR-006)
        range: TimeRange
      timeFilter:
        description: Optional visible time window constraint (FR-007)
        range: TimeFilter
      stepSize:
        description: Step size for discrete navigation (FR-008)
        range: TimeStep
        required: true
      playbackRate:
        description: Playback speed multiplier 0.1-100x (FR-009)
        range: float
        required: true
        minimum_value: 0.1
        maximum_value: 100.0
      playbackState:
        description: Current playback state - ephemeral (FR-010)
        range: PlaybackStateEnum
        required: true
      displayMode:
        description: Track visualization mode (FR-011)
        range: DisplayModeEnum
        required: true

  SpatialSlice:
    description: Geographic view state for the map display
    attributes:
      viewport:
        description: Visible map area as 4-corner polygon (FR-012)
        range: ViewportPolygon
      rotation:
        description: Map rotation in degrees 0-360 (FR-013)
        range: float
        required: true
        minimum_value: 0
        maximum_value: 360

  FeaturesSlice:
    description: Feature selection and visibility state
    attributes:
      featureCollectionUri:
        description: Reference to external feature collection (FR-016)
        range: string
      selection:
        description: Currently selected features (FR-017)
        range: FeatureSelection
        required: true
      hiddenFeatureIds:
        description: Features hidden from display (FR-018)
        range: string
        multivalued: true

  DocumentSlice:
    description: Editor lifecycle state including dirty tracking and undo history
    attributes:
      dirty:
        description: Unsaved changes exist - ephemeral (FR-020)
        range: boolean
        required: true
      savePath:
        description: Last save location
        range: string

  LastToolExecution:
    description: >
      Record of the last tool execution, enabling single-step undo.
      Feature 110-tool-level-undo-gap.
    attributes:
      tool_id:
        description: Identifier of the tool that was executed
        range: string
        required: true
      source_feature_ids:
        description: IDs of the source features the tool operated on
        range: string
        multivalued: true
        required: true
      result_layer_ids:
        description: IDs of the result layers produced by the tool
        range: string
        multivalued: true
        required: true

  ResultsSlice:
    description: >
      Accumulated tool result layers and last-execution record for undo support.
      Features 109-unify-result-layer-lifecycle and 110-tool-level-undo-gap.
    attributes:
      result_layers:
        description: Accumulated tool result features
        range: RawGeoJSONFeature
        multivalued: true
        required: true
        inlined_as_list: true
      last_tool_execution:
        description: Last tool execution record for single-step undo
        range: LastToolExecution
        required: false

  BrowserFilterSlice:
    description: >
      Multi-axis filter state for the STAC browser panel.
      Manages the metadata filter expression plus active flags for
      spatial (viewport) and temporal (timeline) filter axes.
      Feature 132-three-view-sync.
      Note: spatial bounds and temporal range live in SpatialSlice/TemporalSlice;
      this slice only tracks the metadata expression and axis-activation flags.
    attributes:
      metadata_filtered_ids:
        description: >
          Set of exercise IDs passing the current metadata filter.
          Absent/null means all items pass (no filter applied).
        range: string
        multivalued: true
        required: false
      metadata_expression:
        description: >
          Serialised CQL2 filter expression from the filter bar, stored as an
          opaque JSON object (Record<string, unknown>). Absent/null means no
          filter is active. Stored for debugging and round-trip serialisation.
        range: string
        required: false
      spatial_filter_active:
        description: Whether the map viewport is used as a spatial filter
        range: boolean
        required: true
      temporal_filter_active:
        description: Whether the timeline range is used as a temporal filter
        range: boolean
        required: true
