id: https://debrief.info/schemas/common
name: common
title: Debrief Common Types
description: >-
  Common types, enums, and base classes used across Debrief schemas.
  Tracer bullet implementation with core types only.

prefixes:
  linkml: https://w3id.org/linkml/
  debrief: https://debrief.info/schemas/

default_prefix: debrief
default_range: string

imports:
  - linkml:types
  - log-entry

# ============================================================================
# Enums
# ============================================================================

enums:
  FeatureKindEnum:
    description: Discriminator for GeoJSON feature types
    permissible_values:
      TRACK:
        description: Vessel track (LineString geometry)
      POINT:
        description: Reference point/location (Point geometry)
      NARRATIVE:
        description: Timestamped narrative/log entry (no geometry)
      CIRCLE:
        description: Circle annotation (Polygon geometry, center+radius in properties)
      RECTANGLE:
        description: Rectangle annotation (Polygon geometry)
      LINE:
        description: Line annotation (LineString geometry)
      TEXT:
        description: Text annotation at a position (Point geometry)
      VECTOR:
        description: Vector annotation (LineString geometry, origin+range+bearing in properties)
      SYSTEM:
        description: Non-spatial system state (null geometry, reserved state.* IDs)
      POLY:
        description: Arbitrary polygon annotation (Polygon geometry)
      MULTI_POINT:
        description: Multi-point tool result (MultiPoint geometry)
      MULTI_POLYGON:
        description: Multi-polygon tool result (MultiPolygon geometry)
      SYSTEM_RECORD:
        description: Plot-level system record (snapshot chain, branches)
      STORYBOARD:
        description: Storyboard parent feature (panel-only entity, Polygon hull over child Scene viewports)
      STORYBOARD_SCENE:
        description: Storyboard Scene feature (Polygon viewport bounds, captured moment in a Storyboard)

  TrackTypeEnum:
    description: Type of track feature
    permissible_values:
      OWNSHIP:
        description: Own ship track
      CONTACT:
        description: Contact/target track
      REFERENCE:
        description: Reference track
      SOLUTION:
        description: Solution/analysis track

  LocationTypeEnum:
    description: Type of reference location
    permissible_values:
      WAYPOINT:
        description: Navigation waypoint
      EXERCISE_AREA:
        description: Exercise area boundary
      DANGER_AREA:
        description: Danger/exclusion zone
      ANCHORAGE:
        description: Anchorage location
      PORT:
        description: Port/harbor
      REFERENCE:
        description: Generic reference point

  PointShapeEnum:
    description: Valid shapes for point markers
    permissible_values:
      circle:
        description: Filled/stroked circle (default marker)
      square:
        description: Filled/stroked square (reference points)
      triangle:
        description: Filled/stroked triangle (directional indicators)
      diamond:
        description: Diamond shape
      cross:
        description: Cross/plus shape

  NamedColorEnum:
    description: Predefined named colours for styling tool parameters
    permissible_values:
      red:
        description: Red
      green:
        description: Green
      blue:
        description: Blue
      yellow:
        description: Yellow
      orange:
        description: Orange
      purple:
        description: Purple
      cyan:
        description: Cyan
      magenta:
        description: Magenta
      white:
        description: White
      black:
        description: Black
      grey:
        description: Grey

  MarkerSymbolEnum:
    description: Marker shapes for tool parameter choices (superset of PointShapeEnum)
    permissible_values:
      circle:
        description: Filled/stroked circle (default marker)
      square:
        description: Filled/stroked square (reference points)
      triangle:
        description: Filled/stroked triangle (directional indicators)
      diamond:
        description: Diamond shape
      cross:
        description: Cross/plus shape

  CardinalDirectionEnum:
    description: Eight-point compass directions
    permissible_values:
      N:
        description: North
      NE:
        description: North-East
      E:
        description: East
      SE:
        description: South-East
      S:
        description: South
      SW:
        description: South-West
      W:
        description: West
      NW:
        description: North-West

  DurationPresetEnum:
    description: Common ISO 8601 duration presets for interval parameters
    permissible_values:
      PT1M:
        description: 1 minute
      PT5M:
        description: 5 minutes
      PT15M:
        description: 15 minutes
      PT30M:
        description: 30 minutes
      PT1H:
        description: 1 hour
      PT2H:
        description: 2 hours
      PT6H:
        description: 6 hours
      PT12H:
        description: 12 hours
      PT24H:
        description: 24 hours

  NumericPresetEnum:
    description: Common numeric presets for count and distance parameters
    permissible_values:
      n_1:
        description: One
        meaning: debrief:1
      n_2:
        description: Two
        meaning: debrief:2
      n_5:
        description: Five
        meaning: debrief:5
      n_10:
        description: Ten
        meaning: debrief:10
      n_25:
        description: Twenty-five
        meaning: debrief:25
      n_50:
        description: Fifty
        meaning: debrief:50
      n_100:
        description: One hundred
        meaning: debrief:100

  ReferencePointPatternEnum:
    description: Generation patterns for reference point placement
    permissible_values:
      grid:
        description: Evenly spaced grid of rows and columns
      scatter:
        description: Randomly distributed points

  LineCapEnum:
    description: How line endpoints are rendered (SVG/CSS standard)
    permissible_values:
      butt:
        description: Flat edge at endpoint
      round:
        description: Semicircle at endpoint
      square:
        description: Square projection beyond endpoint

  VesselDomainEnum:
    description: Top-level vessel domain classification
    permissible_values:
      surface:
        description: Surface vessels (warships, auxiliaries, merchant)
      subsurface:
        description: Subsurface vessels (submarines)
      unknown:
        description: Vessel domain not determined or not applicable

  LineJoinEnum:
    description: How line segment joints are rendered (SVG/CSS standard)
    permissible_values:
      miter:
        description: Sharp corner (default)
      round:
        description: Rounded corner
      bevel:
        description: Flat corner

  SegmentTypeEnum:
    description: Discriminator for track segment types within compound tracks
    permissible_values:
      TRACK:
        description: Plain recorded track segment
      ABSOLUTE_TMA:
        description: Target Motion Analysis leg with absolute geographic coordinates
      RELATIVE_TMA:
        description: Target Motion Analysis leg relative to ownship position
      DYNAMIC_INFILL:
        description: Interpolated segment between TMA legs

  SystemStateTypeEnum:
    description: Discriminator for system state variants
    permissible_values:
      temporal:
        description: Time viewport state (start/end times)
      spatial:
        description: Map viewport state (bbox, zoom)
      selection:
        description: Feature selection state (selected IDs)
      active_storyboard:
        description: Per-plot active-Storyboard pin (#237)

  ArrayCentreModeEnum:
    description: Array centre calculation mode for towed array sensors
    permissible_values:
      PLAIN:
        description: Simple backtrack along vessel heading
      WORM:
        description: Follow vessel track path backwards
      MEASURED:
        description: Use actual measured array positions

  LineStyleEnum:
    description: Visual style for bearing lines
    permissible_values:
      SOLID:
        description: Continuous line
      DASHED:
        description: Evenly spaced dashes
      DOT:
        description: Evenly spaced dots
      DASH_DOT:
        description: Alternating dash and dot

  LabelLocationEnum:
    description: Horizontal alignment of contact labels
    permissible_values:
      LEFT:
        description: Left-aligned text
      CENTER:
        description: Center-aligned text
      RIGHT:
        description: Right-aligned text

  LineLabelPositionEnum:
    description: Position along the bearing line where the label is placed
    permissible_values:
      START:
        description: At the origin (sensor location)
      MIDDLE:
        description: At the midpoint of the bearing line
      END:
        description: At the far end of the bearing line

# ============================================================================
# Types
# ============================================================================

types:
  Coordinate:
    typeof: float
    description: A geographic coordinate value (longitude or latitude in degrees)

  CSSColor:
    typeof: string
    description: A CSS color string (e.g., "#FF5733", "red", "rgb(255, 87, 51)")
    pattern: "^(#[0-9A-Fa-f]{3,8}|[a-zA-Z]+|rgb\\(.+\\)|rgba\\(.+\\)|hsl\\(.+\\)|hsla\\(.+\\))$"

# ============================================================================
# Base Classes
# ============================================================================

classes:
  BaseFeatureProperties:
    description: >-
      Abstract base for all GeoJSON feature properties classes.
      Provides shared attributes inherited by every concrete properties type.
    abstract: true
    attributes:
      kind:
        description: Feature type discriminator
        range: FeatureKindEnum
        required: true
      tags:
        description: Free-text labels assigned to this feature by the analyst
        range: string
        multivalued: true
        required: false
      provenance:
        description: PROV-aligned provenance records (append-only log of tool operations)
        range: LogEntry
        multivalued: true
        inlined_as_list: true

  TimestampedPosition:
    description: >-
      Temporal and kinematic metadata for a single track position.
      Coordinates are NOT stored here - they live in geometry.coordinates[i].
      Position metadata at index i corresponds to coordinate at index i.
    attributes:
      time:
        description: Position timestamp (ISO8601)
        range: datetime
        required: true
      depth:
        description: Depth in meters (negative = below surface)
        range: float
      course:
        description: Course in degrees (0-360)
        range: float
        minimum_value: 0
        maximum_value: 360
      speed:
        description: Speed in knots
        range: float
        minimum_value: 0
