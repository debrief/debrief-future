id: https://debrief.info/schemas/tool
name: tool
title: Debrief Tool Metadata Schemas
description: >-
  LinkML schemas for analysis tool metadata in Debrief v4.x.
  Defines Tool and SelectionRequirement classes for context-sensitive
  tool offering based on analyst selections.

prefixes:
  linkml: https://w3id.org/linkml/
  debrief: https://debrief.info/schemas/

default_prefix: debrief
default_range: string

imports:
  - linkml:types

# ============================================================================
# Enums
# ============================================================================

enums:
  OutputKindEnum:
    description: >-
      Canonical output kind identifiers for tool result features.
      Set on feature.properties.kind by the executor after tool execution.
      Values use slash-delimited hierarchical paths matching domain/subtype.
      Both Python and TypeScript executors MUST use these values — no
      hand-authored kind strings in tool implementations.
    permissible_values:
      track/statistics:
        description: Track statistics summary (point count, distance, speed, duration)
      dataset/range_bearing_series:
        description: Range-bearing time-series dataset between two features
      region/statistics:
        description: Region/area statistics summary (extent, area, dimensions)

  ResultCategoryEnum:
    description: >-
      Top-level result type categories per TOOL-RESULTS.md.
      Used as prefix for debrief:resultType annotations.
    permissible_values:
      mutation:
        description: Modifies existing feature(s) in the FeatureCollection
      addition:
        description: Creates new GeoJSON feature(s)
      deletion:
        description: Removes feature(s) from the FeatureCollection
      artifact:
        description: Creates non-GeoJSON output (image, report, dataset)

  ParameterTypeEnum:
    description: >-
      Names of available schema-defined parameter types.
      Referenced by ToolParameter.param_type to link tool parameters
      to their value enums defined in common.yaml.
    permissible_values:
      NamedColor:
        description: Predefined named colours (maps to NamedColorEnum)
      MarkerSymbol:
        description: Marker shapes (maps to MarkerSymbolEnum)
      CardinalDirection:
        description: Eight-point compass directions (maps to CardinalDirectionEnum)
      DurationPreset:
        description: Common ISO 8601 duration intervals (maps to DurationPresetEnum)
      NumericPreset:
        description: Common numeric values (maps to NumericPresetEnum)
      ReferencePointPattern:
        description: Reference point generation patterns (maps to ReferencePointPatternEnum)

  ToolCategoryEnum:
    description: >-
      Visual category for Log Panel icon rendering. Declared by the tool
      at registration; consumed by frontends to colour tool-icon glyphs.
      See docs/log-panel-ux-srd.md §5.

      This enum defines only the declarable values. The neutral-grey
      "unknown" state shown by the Log Panel when a tool has no declared
      category is NOT a value of this enum — it is a rendering-layer
      fallback produced when the attribute is null or absent.
    permissible_values:
      import:
        description: File / data ingestion tools (e.g., REP loader, DPF parser, CSV import)
      style:
        description: Appearance-changing tools (e.g., set-track-color, symbol style, label interval)
      calc:
        description: Analytical computation tools (e.g., range-bearing, course/speed, statistics)
      filter:
        description: Tools that narrow the dataset (time filter, spatial filter, trim)
      snapshot:
        description: Tools that export or capture state (export-png, export-csv, export-geojson)

# ============================================================================
# Classes
# ============================================================================

classes:
  SelectionRequirement:
    description: >-
      A constraint specifying which feature kinds a tool accepts,
      with minimum and maximum counts. Used to determine if a tool
      is applicable to the current selection.
    attributes:
      kind:
        description: >-
          The feature kind this requirement applies to. Supports flat values
          (e.g., "TRACK", "POINT") matching the 'kind' property of GeoJSON
          features, and dot-delimited hierarchical paths (e.g., "TRACK.SENSOR",
          "TRACK.SEGMENT") for targeting embedded children within compound
          features.
        range: string
        required: true
      segment_type:
        description: >-
          Optional filter for segment type when kind targets TRACK.SEGMENT.
          Must be a valid SegmentTypeEnum value (e.g., "ABSOLUTE_TMA").
          Only meaningful when kind is "TRACK.SEGMENT".
        range: SegmentTypeEnum
      min:
        description: >-
          Minimum number of features of this kind required.
          Must be >= 0. Defaults to 0 if not specified.
        range: integer
        required: false
        minimum_value: 0
      max:
        description: >-
          Maximum number of features of this kind allowed.
          Must be >= min if both specified. Null means no upper limit.
        range: integer
        required: false
        minimum_value: 0

  Tool:
    description: >-
      An analysis operation with a name, description, version, and
      selection requirements. Tools are discovered from debrief-calc
      via MCP and matched to analyst selections.
    attributes:
      id:
        description: >-
          Unique identifier for the tool. Used for execution and
          deduplication. Should be stable across versions.
        range: string
        required: true
        identifier: true
      name:
        description: >-
          Human-readable name displayed in menus and panels.
          Should be concise (2-4 words).
        range: string
        required: true
      description:
        description: >-
          Brief description of what the tool does. Displayed in
          tooltips and help text. Should be one sentence.
        range: string
        required: false
      version:
        description: >-
          Tool version string for provenance tracking.
          Follows semantic versioning (e.g., "1.0.0").
        range: string
        required: false
      requirements:
        description: >-
          List of selection requirements. Tool is active when ALL
          requirements are satisfied by the current selection.
          Empty list means tool accepts any selection.
        range: SelectionRequirement
        required: false
        multivalued: true
        inlined_as_list: true
      category:
        description: >-
          Visual category for Log Panel icon rendering. Null / absent
          tools render with the neutral-grey "Other" icon. First-party
          tools MUST declare a value (enforced by test policy; see
          specs/207-tool-manifest-categories/research.md §R5).
          Feature 207.
        range: ToolCategoryEnum
        required: false

  ToolParameter:
    description: >-
      A configurable parameter for a tool. Supports string, number,
      boolean, and enum types with optional default values, explicit
      choices, and schema-defined parameter type references.
    attributes:
      name:
        description: Parameter identifier (kebab-case)
        range: string
        required: true
      type:
        description: "Value type discriminator: string, number, boolean, enum"
        range: string
        required: true
      description:
        description: Human-readable parameter description
        range: string
        required: true
      required:
        description: Whether parameter must be provided
        range: boolean
        required: false
      default_value:
        description: Default value if not provided
        range: string
        required: false
      param_type:
        description: >-
          References a schema-defined parameter-type enum by name.
          When set, the client resolves enum values from generated types
          rather than using inline choices.
        range: ParameterTypeEnum
        required: false
