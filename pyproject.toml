[project]
name = "debrief"
version = "4.0.0"
description = "Debrief v4.x - Maritime tactical analysis platform"
requires-python = ">=3.11"

[tool.uv.workspace]
members = [
    "shared/schemas",
    "shared/data",
    "services/stac",
    "services/io",
    "services/config",
    "services/calc",
    "services/cli",
    "services/debrief-tools",
    "services/session-state-py",
]

[tool.uv.sources]
debrief-schemas = { workspace = true }
debrief-data = { workspace = true }
debrief-stac = { workspace = true }
debrief-io = { workspace = true }
debrief-config = { workspace = true }
debrief-calc = { workspace = true }
debrief-cli = { workspace = true }

[dependency-groups]
dev = [
    "debrief-schemas",
    "debrief-data",
    "debrief-stac",
    "debrief-io",
    "debrief-config",
    "debrief-calc",
    "debrief-cli",
    "pydantic>=2.12.5",
    "pyinstaller>=6.18.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pyright>=1.1.0",
    "ruff>=0.8.0",
    "click>=8.0.0",
    "mcp>=1.0.0",
    "stac-validator>=3.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "shared/schemas/tests", "shared/data/tests", "services/io/tests", "services/config/tests", "services/calc/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--import-mode=importlib --ignore=services/stac/tests"
# Test isolation issue: test_empty_list_when_no_stores fails due to shared state
# TODO: Fix test isolation in services/config/tests/test_core.py
xfail_strict = false
