name: Python Lint

on:
  push:
    branches: [main, "claude/*"]
    paths:
      - '**/*.py'
      - 'ruff.toml'
      - 'pyproject.toml'
      - '.github/workflows/python-lint.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.py'
      - 'ruff.toml'
      - 'pyproject.toml'
      - '.github/workflows/python-lint.yml'

jobs:
  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      # `uv run` resolves ruff from uv.lock, so CI runs the same version as
      # `task lint` and local development. Previously these used `uvx ruff`,
      # which is unpinned and silently drifts to whatever is latest at run time
      # — a newer ruff enabled Markdown code-block formatting by default and
      # turned 104 untouched spec files red on the next PR to add a .py file.
      # Pinning to the lockfile is Article IX.2 (pinned versions for
      # reproducibility) and keeps local and CI in agreement.
      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .
