name: Publish Code Graph

# Publishes the committed graphify pages to gh-pages alongside spec-navigator and
# backlog-navigator (keep_files: true keeps the siblings intact).
# See ADR-041 and docs/graphify-developer-guide.md.
#
# This deploys committed artefacts — it does NOT rebuild the graph. The pages in
# graphify-out/pages/ are produced by `task graph:build && task graph:pages` and
# committed, so publishing is a copy rather than a ~45s regeneration on every
# deploy, and the deployed bytes are exactly the reviewed bytes.
#
# It is a publisher, not a gate: it never runs on pull requests and cannot block
# a merge. Keeping the pages current is the author's job at rebuild time; the
# freshness job below reports drift without failing anything.

on:
  push:
    branches: [main]
    paths:
      - 'graphify-out/pages/**'
      - 'graphify-out/GRAPH_REPORT.md'
      - '.github/workflows/graphify-publish.yml'
  workflow_dispatch:

concurrency:
  group: graphify-publish
  cancel-in-progress: true

jobs:
  publish:
    name: Publish committed pages
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify pages are present
        run: |
          set -euo pipefail
          # build-graph-pages.sh assembles the whole tree, GRAPH_REPORT.md included,
          # so publishing is a pure copy. Fail loudly rather than deploying a
          # half-built directory if someone commits without running it.
          for required in index.html tree.html adr/index.html GRAPH_REPORT.md; do
            test -f "graphify-out/pages/${required}" \
              || { echo "::error::graphify-out/pages/${required} missing — run 'task graph:build && task graph:pages' and commit."; exit 1; }
          done

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./graphify-out/pages
          destination_dir: code-graph
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

  freshness:
    name: Report graph freshness
    runs-on: ubuntu-latest
    # Advisory only — never fails the build. The graph is committed, so it can
    # drift behind source until someone re-runs `task graph:build`. This says so
    # out loud in the Actions summary instead of letting it rot silently.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout full history
        run: git fetch --unshallow origin main || true

      - name: Compare graph commit against last graphed-source change
        run: |
          set -euo pipefail
          # A graph can never carry the SHA of the commit that contains it, so
          # comparing against HEAD would report "stale" on every single run.
          # What matters is whether any *graphed source* has changed since the
          # build — docs, workflows and the graph itself are irrelevant.
          built=$(grep -oE 'Built from commit: `[0-9a-f]+`' graphify-out/GRAPH_REPORT.md \
                  | grep -oE '[0-9a-f]{6,}' || echo "")
          last_src=$(git log -1 --format=%h -- services shared apps || echo "")
          {
            echo "### Code graph freshness"
            echo ""
            if [ -z "$built" ]; then
              echo "⚠️ Could not read a build commit from \`GRAPH_REPORT.md\`."
              exit 0
            fi
            echo "- Graph built from: \`${built}\`"
            echo "- Last graphed-source commit: \`${last_src:-none}\`"
            echo ""
            if [ -n "$last_src" ] \
               && ! git merge-base --is-ancestor "$last_src" "$built" 2>/dev/null; then
              behind=$(git rev-list --count "${built}..${last_src}" -- services shared apps 2>/dev/null || echo "?")
              echo "⚠️ Source has moved ${behind} commit(s) since the graph was built."
              echo "Run \`task graph:build && task graph:pages\` and commit to refresh."
            else
              echo "✅ Graph covers the current source."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
