name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'apps/web-shell/**'
      - 'apps/vscode/**'
      - 'tests/e2e/**'
      - 'services/**'
      - 'shared/**'

jobs:
  # ── Web-Shell E2E (Playwright + Vite dev server) ──────────────────────────
  # Exercises the full React UI (map, layers, tools, time controller,
  # selection sync) against mock STAC data. Fast (~30s), no Docker.
  web-shell:
    name: Web-Shell E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable corepack
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build workspace dependencies
        # #273: briefing-renderer must be built so the web-shell vite dev
        # server can serve it under /briefing-renderer/ — the live-preview E2E
        # (storyboard-preview.spec.ts) opens that path in a new tab.
        run: pnpm --filter @debrief/utils --filter @debrief/schemas --filter @debrief/session-state --filter @debrief/stac-writer --filter @debrief/components --filter @debrief/briefing-renderer build

      - name: Run web-shell Playwright tests
        run: pnpm --filter @debrief/web-shell test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-shell-playwright-report
          path: apps/web-shell/playwright-report/
          retention-days: 14

      - name: Upload trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-shell-trace
          path: apps/web-shell/test-results/
          retention-days: 14

  # ── VS Code E2E (Playwright + openvscode-server, no Docker) ───────────────
  # Exercises the VS Code extension with real Python services. Starts
  # openvscode-server directly on the runner — no Docker required.
  vscode:
    name: VS Code E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.49.1
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable corepack
        run: corepack enable pnpm

      - name: Install dependencies
        run: task install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build workspace dependencies
        # #273: schemas is needed by the briefing-renderer build that
        # `pnpm run build` runs via sync-briefing-renderer; briefing-export is
        # imported by exportStoryboardAsBriefingZip and bundled by esbuild.
        run: pnpm --filter @debrief/utils --filter @debrief/schemas --filter @debrief/session-state --filter @debrief/stac-writer --filter @debrief/components --filter @debrief/briefing-export build

      - name: Build and package VS Code extension
        working-directory: apps/vscode
        run: pnpm run build && pnpm run package

      # Install openvscode-server (lightweight, no Docker)
      - name: Install openvscode-server
        run: |
          OVS_VERSION="1.109.5"
          OVS_URL="https://github.com/gitpod-io/openvscode-server/releases/download/openvscode-server-v${OVS_VERSION}/openvscode-server-v${OVS_VERSION}-linux-x64.tar.gz"
          echo "Downloading openvscode-server v${OVS_VERSION}..."
          curl -fsSL "$OVS_URL" | tar xz -C /tmp
          sudo mv "/tmp/openvscode-server-v${OVS_VERSION}-linux-x64" /opt/openvscode-server
          sudo ln -sf /opt/openvscode-server/bin/openvscode-server /usr/local/bin/openvscode-server

      # Patch openvscode-server webview files for E2E testing.
      # Without these patches, the webview view lifecycle is broken:
      #   1. Service worker blocks workerReady
      #   2. CSP hash mismatch prevents modified script execution
      #   3. Origin hash guard silently drops webview-ready messages
      #   4. isBodyVisible() gate prevents resolveWebviewView in headless
      # All patches include version guards that fail fast on mismatch.
      - name: Patch webview for E2E
        run: |
          bash tests/e2e/scripts/patch-webview.sh /opt/openvscode-server
          echo "patch-webview-success=true" >> "$GITHUB_OUTPUT"

      # Install extension into openvscode-server
      # Use the same user-data-dir that the server will use so it finds the extension
      - name: Install Debrief extension
        run: |
          DATA_DIR="/tmp/ovs-data"
          mkdir -p "$DATA_DIR"
          VSIX=$(ls apps/vscode/*.vsix | head -1)
          openvscode-server --install-extension "$VSIX" --user-data-dir "$DATA_DIR"
          echo "Installed extensions:"
          openvscode-server --list-extensions --user-data-dir "$DATA_DIR"

      # Pre-seed config so STAC tree is populated
      - name: Seed Debrief config
        run: |
          mkdir -p ~/.config/debrief
          STORE_PATH="${GITHUB_WORKSPACE}/tests/e2e/test-workspace/local-store"
          echo "{\"stores\":[{\"id\":\"local-store\",\"path\":\"${STORE_PATH}\",\"displayName\":\"Test Maritime Data\",\"status\":\"available\"}],\"preferences\":{}}" \
            > ~/.config/debrief/config.json

      # Start openvscode-server (background)
      # NOTE: openvscode-server appends /data to --user-data-dir internally (issue #512),
      # so we write settings to BOTH paths as belt-and-suspenders.
      - name: Start openvscode-server
        run: |
          DATA_DIR="/tmp/ovs-data"
          WORKSPACE="${GITHUB_WORKSPACE}/tests/e2e/test-workspace"
          SETTINGS='{"security.workspace.trust.enabled":false,"workbench.startupEditor":"none","workbench.welcomePage.walkthroughs.openOnInstall":false,"workbench.tips.enabled":false}'
          mkdir -p "$DATA_DIR/User" "$DATA_DIR/data/User"
          echo "$SETTINGS" > "$DATA_DIR/User/settings.json"
          echo "$SETTINGS" > "$DATA_DIR/data/User/settings.json"
          nohup openvscode-server \
            --host 0.0.0.0 --port 8080 \
            --without-connection-token \
            --telemetry-level off \
            --disable-workspace-trust \
            --user-data-dir "$DATA_DIR" \
            --default-folder "$WORKSPACE" \
            > /tmp/ovs.log 2>&1 &

      - name: Wait for server readiness
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080 > /dev/null 2>&1; then
              echo "openvscode-server ready after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "Server failed to start. Log:"
          cat /tmp/ovs.log
          exit 1

      # Run VS Code E2E tests (excluding Heroku-specific smoke tests)
      - name: Run VS Code E2E tests
        env:
          CODE_SERVER_URL: http://localhost:8080
          E2E_WORKSPACE_FOLDER: ${{ github.workspace }}/tests/e2e/test-workspace
          CI: true
        run: npx playwright test --config tests/e2e/playwright.config.ts --grep-invert "Heroku"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vscode-playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vscode-e2e-screenshots
          path: |
            specs/005-e2e-workflow-tests/evidence/screenshots/
            tests/e2e/evidence/
          retention-days: 14

      - name: Upload trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vscode-e2e-trace
          path: test-results/
          retention-days: 14
