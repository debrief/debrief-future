name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'tests/e2e/**'
      - 'docker/code-server/**'
      - 'apps/vscode/**'
      - 'services/**'
      - 'shared/schemas/**'

jobs:
  e2e:
    name: E2E Tests (code-server + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable corepack
        run: corepack enable pnpm

      - name: Install dependencies
        run: task install

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Build workspace dependencies
        run: pnpm --filter @debrief/session-state --filter @debrief/components build

      - name: Build and package VS Code extension
        working-directory: apps/vscode
        run: pnpm run build && pnpm run package

      # Build and start code-server Docker container
      - name: Build Docker image
        run: docker compose -f docker/code-server/docker-compose.yml build

      - name: Start code-server
        run: docker compose -f docker/code-server/docker-compose.yml up -d

      # Health check: wait for code-server to be ready
      - name: Wait for code-server readiness
        run: |
          echo "Waiting for code-server..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/healthz > /dev/null 2>&1; then
              echo "code-server ready after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "code-server failed to start within 60s"
          docker compose -f docker/code-server/docker-compose.yml logs
          exit 1

      # Verify the Debrief config is present inside the container.
      # The Dockerfile pre-seeds it, but verify here for diagnostics.
      - name: Verify container config
        run: |
          CONTAINER=$(docker compose -f docker/code-server/docker-compose.yml ps -q code-server)
          echo "=== Container user and HOME ==="
          docker exec $CONTAINER bash -c 'whoami; echo HOME=$HOME; echo XDG=${XDG_CONFIG_HOME:-unset}'
          echo "=== Config file ==="
          docker exec $CONTAINER cat /home/coder/.config/debrief/config.json 2>&1 || {
            echo "Config missing — creating it"
            docker exec $CONTAINER mkdir -p /home/coder/.config/debrief
            docker exec $CONTAINER bash -c 'cat > /home/coder/.config/debrief/config.json <<EOFCFG
          {"stores":[{"id":"local-store","path":"/workspace/test-workspace/local-store","displayName":"Test Maritime Data","status":"available"}],"preferences":{}}
          EOFCFG'
            echo "Config written"
          }
          echo "=== Store path ==="
          docker exec $CONTAINER ls /workspace/test-workspace/local-store/catalog.json 2>&1 || echo "CATALOG MISSING"
          echo "=== Extension installed ==="
          docker exec $CONTAINER ls /home/coder/.local/share/code-server/extensions/ 2>&1 || echo "NO EXTENSIONS"

      # Run E2E tests
      - name: Run E2E tests
        env:
          CODE_SERVER_URL: http://localhost:8080
          CI: true
        run: npx playwright test --config tests/e2e/playwright.config.ts --grep-invert "Heroku"

      # Upload artifacts on failure or success
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: specs/005-e2e-workflow-tests/evidence/screenshots/
          retention-days: 14

      - name: Upload trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-trace
          path: test-results/
          retention-days: 14

      # Teardown
      - name: Stop code-server
        if: always()
        run: docker compose -f docker/code-server/docker-compose.yml down
