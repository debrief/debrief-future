# Storybook & Web Shell Deployment
#
# - On PRs: deploys preview to pr-preview/pr-{number}/ (cleaned up on close)
# - On main: deploys persistent copies to components-storybook/ and web-shell/
#
# Preview URLs:
#   Storybook: https://debrief.github.io/debrief-future/pr-preview/pr-{number}/
#   Web Shell: https://debrief.github.io/debrief-future/pr-preview/pr-{number}/web-shell/
#
# Persistent URLs:
#   Storybook: https://debrief.github.io/debrief-future/components-storybook/
#   Web Shell: https://debrief.github.io/debrief-future/web-shell/

name: Storybook Preview

on:
  push:
    branches:
      - main
    paths:
      - 'shared/components/**'
      - 'apps/web-shell/**'
      - 'apps/vscode/**'
      - 'preview/workspace/samples/**'
      - 'services/calc/**'
      - '.github/workflows/storybook-preview.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'shared/components/**'
      - 'apps/web-shell/**'
      - 'apps/vscode/**'
      - 'preview/workspace/samples/**'
      - 'services/calc/**'
      - '.github/workflows/storybook-preview.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  # Deploy persistent Storybook and Web Shell on push to main
  deploy-main:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Build shared packages
        run: pnpm --filter @debrief/utils build && pnpm --filter @debrief/components build

      - name: Build Storybook
        run: pnpm --filter @debrief/components build-storybook
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Build Web Shell
        run: pnpm --filter @debrief/web-shell build
        env:
          VITE_BASE_URL: /debrief-future/web-shell/
          STAC_STORE_PATH: ${{ github.workspace }}/preview/workspace/samples/local-store

      - name: Create root landing page
        run: |
          mkdir -p /tmp/gh-pages-root
          cat > /tmp/gh-pages-root/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0;url=web-shell/">
            <title>Debrief Future</title>
          </head>
          <body>
            <p>Redirecting to <a href="web-shell/">Web Shell</a>…</p>
            <script>window.location.replace('web-shell/');</script>
          </body>
          </html>
          EOF

      - name: Deploy root landing page to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/gh-pages-root
          keep_files: true

      - name: Deploy Storybook to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./shared/components/storybook-static
          destination_dir: components-storybook
          keep_files: true

      - name: Deploy Web Shell to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apps/web-shell/dist
          destination_dir: web-shell
          keep_files: true

  # Deploy PR preview
  build-and-deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Build shared packages
        run: pnpm --filter @debrief/utils build && pnpm --filter @debrief/components build

      - name: Build Storybook
        run: pnpm --filter @debrief/components build-storybook
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Build Web Shell
        run: pnpm --filter @debrief/web-shell build
        env:
          VITE_BASE_URL: /debrief-future/pr-preview/pr-${{ github.event.pull_request.number }}/web-shell/
          STAC_STORE_PATH: ${{ github.workspace }}/preview/workspace/samples/local-store

      - name: Deploy Storybook to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./shared/components/storybook-static
          destination_dir: pr-preview/pr-${{ github.event.pull_request.number }}
          keep_files: true

      - name: Deploy Web Shell to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apps/web-shell/dist
          destination_dir: pr-preview/pr-${{ github.event.pull_request.number }}/web-shell
          keep_files: true

      - name: Comment PR with preview link
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const baseUrl = `https://debrief.github.io/debrief-future`;
            const previewUrl = `${baseUrl}/pr-preview/pr-${prNumber}/`;
            const webShellPreviewUrl = `${baseUrl}/pr-preview/pr-${prNumber}/web-shell/`;
            const codeServerUrl = `https://debrief-preview-pr-${prNumber}.herokuapp.com`;
            const persistentUrl = `${baseUrl}/components-storybook/`;
            const webShellUrl = `${baseUrl}/web-shell/`;

            // Find existing preview comment across all pages
            const marker = '<!-- storybook-preview-comment -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(comment =>
              comment.body.includes(marker)
            ) || comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Preview Deployments')
            );

            const body = [
              marker,
              '## 🚀 Preview Deployments',
              '',
              '### Code Server (Full VS Code Extension)',
              `🖥️ [Open Code Server](${codeServerUrl})`,
              '',
              'Browser-based VS Code with the Debrief extension and sample data pre-installed.',
              '',
              '### Web Shell (Standalone App)',
              `📱 [Open Web Shell](${webShellPreviewUrl})`,
              '',
              'Use this for Playwright testing and demos - runs outside Storybook.',
              '',
              '### Storybook (Component Library)',
              `📚 [Open Storybook](${previewUrl})`,
              '',
              'Browse all components, stories, and documentation.',
              '',
              '---',
              '',
              '<details>',
              '<summary>All Links</summary>',
              '',
              '| Environment | Code Server | Web Shell | Storybook |',
              '|-------------|-------------|-----------|-----------|',
              `| This PR | [Open IDE](${codeServerUrl}) | [Open App](${webShellPreviewUrl}) | [Open Storybook](${previewUrl}) |`,
              `| Main branch | — | [Open App](${webShellUrl}) | [Open Storybook](${persistentUrl}) |`,
              '',
              '</details>',
              '',
              `> Updated on commit ${context.sha.substring(0, 7)}`,
            ].join('\n');

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body,
              });
            }

  # Cleanup old previews when PR is closed
  cleanup:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Remove preview directory
        run: |
          rm -rf pr-preview/pr-${{ github.event.pull_request.number }}
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git diff --staged --quiet || git commit -m "Remove preview for PR #${{ github.event.pull_request.number }}"
          git push
