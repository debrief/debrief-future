name: Backlog Navigator — Lighthouse PWA gate

on:
  pull_request:
    paths:
      - 'apps/backlog-navigator/**'
      - 'shared/components/**'
      - '.github/workflows/backlog-navigator-lighthouse.yml'
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backlog-navigator
        run: pnpm --filter @debrief/backlog-navigator build
        env:
          # Static-host base URL — override here so the manifest scope ('/')
          # matches the served path during the audit.
          VITE_BASE_URL: '/'

      - name: Start preview server
        run: pnpm --filter @debrief/backlog-navigator preview --port 5175 --host 0.0.0.0 &
        env:
          NODE_ENV: production

      - name: Wait for server
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:5175/ > /dev/null; then
              echo "Server is up"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not start in 30s"
          exit 1

      - name: Run Lighthouse CI
        run: pnpm dlx @lhci/cli autorun --config apps/backlog-navigator/.lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: |
            .lighthouseci/
            apps/backlog-navigator/dist/manifest.webmanifest
          retention-days: 7
