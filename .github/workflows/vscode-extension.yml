name: VS Code Extension

on:
  push:
    branches: [main]
    paths:
      - 'apps/vscode/**'
      - 'shared/components/**'
      - '.github/workflows/vscode-extension.yml'
    tags:
      - 'vscode-v*'
  pull_request:
    branches: [main]
    paths:
      - 'apps/vscode/**'
      - 'shared/components/**'
      - '.github/workflows/vscode-extension.yml'

defaults:
  run:
    working-directory: apps/vscode

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable corepack
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Build shared packages
        # #192: @debrief/session-state must build BEFORE @debrief/components
        # (the latter imports @debrief/session-state/browser; tsc's exports-map
        # resolution needs its dist). #273: also build @debrief/briefing-export
        # — imported by exportStoryboardAsBriefingZip, resolved to dist — AFTER
        # @debrief/components (it imports the storyboard subpath); schemas is
        # source-resolved but built here for parity. The && chain keeps the
        # order explicit.
        run: pnpm --filter @debrief/utils build && pnpm --filter @debrief/session-state build && pnpm --filter @debrief/schemas build && pnpm --filter @debrief/stac-writer build && pnpm --filter @debrief/components build && pnpm --filter @debrief/briefing-export build
        working-directory: .

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Run unit tests
        run: pnpm run test:unit

      - name: Build extension
        run: pnpm run build

      - name: Package VSIX
        run: pnpm run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: debrief-vscode-${{ github.sha }}
          path: apps/vscode/*.vsix
          retention-days: 30

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/vscode-v')

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable corepack
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Build and package
        run: |
          pnpm run build
          pnpm run package

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/vscode-v}" >> $GITHUB_OUTPUT
        working-directory: .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Debrief VS Code Extension v${{ steps.version.outputs.version }}
          body: |
            ## Installation

            1. Download `debrief-vscode-${{ steps.version.outputs.version }}.vsix` below
            2. Open VS Code → Extensions → `...` menu → "Install from VSIX..."
            3. Select the downloaded file

            Or via command line:
            ```
            code --install-extension debrief-vscode-${{ steps.version.outputs.version }}.vsix
            ```
          files: apps/vscode/*.vsix
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
