name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # #190 SC-006 — fail any PR that accidentally commits a provider key.
      # Uses the gitleaks CLI directly (no marketplace action) for predictable
      # behaviour across private repos and org boundaries. Scans the worktree
      # against rules + allowlist in gitleaks.toml; node_modules/, .venv/,
      # and generated schemas are allowlisted there. The dist/ + apps/nl-demo/
      # dist/ scan below runs after build artefacts land.
      - name: Scan worktree for leaked credentials (gitleaks)
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks detect --no-git --source . --config gitleaks.toml --redact --verbose

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.49.1
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable corepack
        run: corepack enable pnpm

      - name: Install dependencies
        run: task install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run linting
        run: task lint

      - name: Run knip
        run: task knip

      - name: Run type checking
        run: task typecheck

      - name: Run tests
        # TEMPORARY (#191 PR debug) — split task test into its sub-commands
        # and report which one fails. Revert to `run: task test` once the
        # underlying failure is identified.
        run: |
          set +e

          run_step() {
            local label="$1"; shift
            echo "::group::Test step: $label"
            "$@" 2>&1 | tee "/tmp/test-${label}.log"
            local rc=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "::warning::test-failed: $label (exit $rc)"
              # Surface vitest's "FAIL  path" + "✗" rows from the log.
              sed 's/\x1b\[[0-9;]*m//g' "/tmp/test-${label}.log" \
                | grep -E '(^FAIL|✗ |⎯⎯⎯|^\s*✘|Tests\s*\([0-9]+\s*failed|Test Files\s*\([0-9]+\s*failed|^\s*Failures:|TypeError|ReferenceError|AssertionError|^Error:|Expected:|Received:|^\s+at\s+/)' \
                | head -12 \
                | while IFS= read -r line; do
                    short=$(printf '%.300s' "$line")
                    echo "::warning::${label}: $short"
                  done
            fi
            return $rc
          }

          run_step pytest uv run pytest || EXIT=$?
          run_step vitest pnpm --filter '!@debrief/web-shell' test || EXIT=$?
          run_step web-shell-pw bash -c 'cd apps/web-shell && node run-playwright.mjs' || EXIT=$?
          run_step spec-nav-build pnpm --filter @debrief/spec-navigator build || EXIT=$?
          run_step spec-nav-pw bash -c 'cd apps/spec-navigator && node run-playwright.mjs' || EXIT=$?

          exit "${EXIT:-0}"

      # #190 SC-006 — post-build secret scan on the produced bundles. Fails if
      # a provider key somehow entered dist/ or apps/nl-demo/dist/ (e.g. via
      # accidental envsubst, embedded .env, or test-fixture leak).
      - name: Scan build artefacts for leaked credentials (gitleaks)
        if: always()
        run: |
          set -euo pipefail
          command -v gitleaks >/dev/null 2>&1 || {
            echo "[gitleaks-artefact-scan] installing gitleaks CLI"
            curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
              | tar -xz -C /tmp gitleaks
            sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          }
          for dir in dist apps/nl-demo/dist; do
            if [ -d "$dir" ]; then
              echo "[gitleaks-artefact-scan] scanning $dir"
              gitleaks detect --no-git --source "$dir" --config gitleaks.toml --redact --verbose
            else
              echo "[gitleaks-artefact-scan] $dir does not exist — skipping"
            fi
          done
