<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Debrief logo: D with compass rose and divider tool -->

  <!-- D letterform — vertical bar + arc -->
  <path d="M8 2V22" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M8 2C8 2 9 2 11 2C17.08 2 22 6.48 22 12C22 17.52 17.08 22 11 22C9 22 8 22 8 22" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/>

  <!-- Compass rose inside the D arc -->
  <g transform="translate(14, 12)">
    <!-- Cardinal ticks -->
    <line x1="0" y1="-5.5" x2="0" y2="-3.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="0" y1="3.2" x2="0" y2="5.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="-5.5" y1="0" x2="-3.2" y2="0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="3.2" y1="0" x2="5.5" y2="0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    <!-- Intercardinal ticks -->
    <line x1="-3.5" y1="-3.5" x2="-2.3" y2="-2.3" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
    <line x1="2.3" y1="-2.3" x2="3.5" y2="-3.5" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
    <line x1="-3.5" y1="3.5" x2="-2.3" y2="2.3" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
    <line x1="2.3" y1="2.3" x2="3.5" y2="3.5" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
    <!-- Hub -->
    <circle cx="0" cy="0" r="1.3" fill="currentColor"/>
  </g>

  <!-- Divider tool — two legs from a pivot -->
  <circle cx="4" cy="2.5" r="1.1" fill="currentColor"/>
  <line x1="4" y1="3.5" x2="8.5" y2="14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="4" y1="3.5" x2="2" y2="21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
</svg>
