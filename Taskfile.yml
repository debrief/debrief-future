# Debrief v4.x Build System
#
# Prerequisites:
#   - Task (https://taskfile.dev/installation/)
#   - uv (curl -LsSf https://astral.sh/uv/install.sh | sh)
#   - pnpm (npm install -g pnpm)
#
# Usage:
#   task --list       Show all available tasks
#   task install      Install all dependencies
#   task test         Run all tests
#   task build        Build all artifacts
#   task dev          Start development watch mode
#   task lint         Check code style
#   task lint:fix     Auto-fix code style issues
#   task verify       Run full CI checks locally before pushing
#   task clean        Remove build artifacts

version: '3'

vars:
  PYTHON_SOURCES: "services/**/*.py shared/**/*.py"
  TS_SOURCES: "apps/**/*.ts apps/**/*.tsx shared/**/*.ts shared/**/*.tsx"

tasks:
  default:
    desc: "Show available tasks"
    cmds:
      - task --list

  # Precondition checks - used by install task
  _check-prereqs:
    internal: true
    preconditions:
      - sh: command -v uv
        msg: "uv not found. Install: curl -LsSf https://astral.sh/uv/install.sh | sh"
      - sh: command -v pnpm
        msg: "pnpm not found. Install: npm install -g pnpm"

  install:
    desc: "Install all dependencies (Python + Node.js)"
    deps: [_check-prereqs]
    sources:
      - uv.lock
      - pnpm-lock.yaml
      - pyproject.toml
      - package.json
      - "**/pyproject.toml"
      - "**/package.json"
    cmds:
      - uv sync
      - pnpm install

  test:
    desc: "Run all tests (Python + TypeScript + Playwright E2E)"
    deps: [install, build]
    cmds:
      - uv run pytest
      - pnpm --filter '!@debrief/web-shell' test
      - cd apps/web-shell && node run-playwright.mjs
      - pnpm --filter @debrief/spec-navigator build
      - cd apps/spec-navigator && node run-playwright.mjs

  knip:
    desc: "Run knip — fail if any non-declared unused files are detected under apps/loader/src/main/"
    deps: [install]
    cmds:
      # Scans apps/loader. The gate's SC (see specs/201-knip-loader-config/spec.md
      # SC-001, SC-005) is specifically about files under apps/loader/src/main/;
      # we pipe knip's JSON reporter through jq to assert that set is empty,
      # while leaving pre-existing findings elsewhere in the loader (renderer
      # barrels, unused devDeps) visible but non-blocking for now.
      - |
        pnpm exec knip -W apps/loader --reporter json --no-exit-code > /tmp/knip.json
        MAIN_FINDINGS=$(jq '[.files[] | select(startswith("apps/loader/src/main/"))] | length' /tmp/knip.json)
        if [ "$MAIN_FINDINGS" -gt 0 ]; then
          echo "task knip: FAIL — $MAIN_FINDINGS file(s) under apps/loader/src/main/ flagged as unused:"
          jq -r '.files[] | select(startswith("apps/loader/src/main/"))' /tmp/knip.json
          echo ""
          echo "Either import the file from a declared entry (see knip.json) or delete it."
          exit 1
        fi
        echo "task knip: PASS — zero unused files under apps/loader/src/main/."

  build:
    desc: "Build all artifacts (Python wheels + TypeScript bundles)"
    deps: [install]
    cmds:
      - uv build --all
      - pnpm build

  dev:
    desc: "Start development watch mode"
    deps: [install]
    cmds:
      - pnpm storybook

  typecheck:
    desc: "Run type checking (Python + TypeScript)"
    deps: [install]
    cmds:
      - uv run pyright
      - pnpm -r typecheck

  lint:
    desc: "Check code style (Python + TypeScript)"
    deps: [install, build]
    cmds:
      - uv run ruff check .
      - pnpm lint
      - node scripts/check-eslint-drift-wiring.cjs
      - bash scripts/check-no-geojson-feature.sh
      - bash scripts/check-no-hand-typed-temporal-enums.sh
      - bash scripts/check-adr-refs.sh
      - bash scripts/check-log-panel-skip-guard.sh

  lint:fix:
    desc: "Auto-fix code style issues"
    deps: [install]
    cmds:
      - uv run ruff check --fix .
      - uv run ruff format .
      - pnpm lint -- --fix

  verify:ffmpeg:
    desc: "Verify ffmpeg system binary is present (Feature 234 FR-045 — required for Playwright GIF capture)"
    cmds:
      - |
        if ! command -v ffmpeg >/dev/null 2>&1; then
          echo "task verify:ffmpeg: FAIL — ffmpeg not found on PATH."
          echo "  ffmpeg required for Playwright video → GIF conversion (#234 FR-045)."
          echo "  Install via: brew install ffmpeg  (macOS)"
          echo "             apt install ffmpeg   (Debian/Ubuntu)"
          echo "             scoop install ffmpeg (Windows)"
          exit 1
        fi
        echo "task verify:ffmpeg: PASS — $(ffmpeg -version 2>&1 | head -1)"

  verify:
    desc: "Run full CI checks locally (lint + typecheck + test + knip + ffmpeg) before pushing"
    deps: [install]
    cmds:
      - task: verify:ffmpeg
      - task: lint
      - task: typecheck
      - task: test
      - task: knip

  schema:generate:
    desc: "Regenerate Pydantic, JSON Schema, and TypeScript artefacts from LinkML"
    deps: [install]
    cmds:
      - cd shared/schemas && uv run python scripts/generate.py

  schema:check-drift:
    desc: "Verify generated artefacts under shared/schemas/src/generated/ match a fresh regeneration"
    deps: [schema:generate]
    cmds:
      - |
        if ! git diff --quiet -- shared/schemas/src/generated/; then
          echo "::error::Generated artefacts have drifted. Run 'task schema:generate' and commit the result."
          git --no-pager diff --stat -- shared/schemas/src/generated/
          exit 1
        fi

  docs:generate:
    desc: "Generate Markdown docs from LinkML schemas (shared/schemas/build/md/)"
    deps: [install]
    cmds:
      - uv run --extra docs python shared/schemas/scripts/generate.py --target docs

  docs:build:
    desc: "Build HTML docs site via MkDocs (shared/schemas/build/html/)"
    deps: [docs:generate]
    cmds:
      - cd shared/schemas && uv run --extra docs mkdocs build

  docs:serve:
    desc: "Serve docs locally on http://localhost:8000 (auto-reloads)"
    deps: [docs:generate]
    cmds:
      - cd shared/schemas && uv run --extra docs mkdocs serve

  preview:build:
    desc: "Build the preview container (code-server + Debrief extension)"
    preconditions:
      - sh: command -v docker
        msg: "Docker not found. Install Docker to build the preview container."
    cmds:
      - docker build -t debrief-preview -f Dockerfile.preview .

  preview:run:
    desc: "Run the preview container locally (http://localhost:8080)"
    preconditions:
      - sh: docker image inspect debrief-preview >/dev/null 2>&1
        msg: "Preview image not built. Run 'task preview:build' first."
    cmds:
      - docker run --rm -p 8080:8080 -e PORT=8080 debrief-preview

  preview:package:
    desc: "Package the VS Code extension as .vsix"
    deps: [build]
    cmds:
      - cd apps/vscode && npx vsce package --no-dependencies

  # The ADR merge must always run LAST. `graphify cluster-only` rewrites
  # graph.json with its own serialiser, which re-inflates the file (~14MB→18MB)
  # and collapses same-endpoint edges — losing per-line citation multiplicity.
  # Running the merge afterwards keeps the committed graph compact and complete.
  graph:build:
    desc: "Build the code knowledge graph (deterministic, offline, no API key) — see ADR-041"
    cmds:
      - uvx --from graphifyy==0.9.35 graphify extract . --code-only --out .
      - uvx --from graphifyy==0.9.35 graphify cluster-only . --no-viz --no-label
      - task: graph:adr

  graph:adr:
    desc: "Extract the ADR citation graph and merge it into graphify-out/graph.json (run last)"
    cmds:
      - uv run python scripts/extract-adr-graph.py --merge

  graph:refresh:
    desc: "Incrementally re-extract changed code files into the existing graph"
    cmds:
      - uvx --from graphifyy==0.9.35 graphify update . --no-cluster
      - task: graph:adr

  graph:report:
    desc: "Regenerate GRAPH_REPORT.md (skips HTML — graph far exceeds the 5k-node viz limit)"
    cmds:
      - uvx --from graphifyy==0.9.35 graphify cluster-only . --no-viz --no-label
      - task: graph:adr

  graph:pages:
    desc: "Build the publishable pages: landing index, repo-wide D3 tree, ADR graph, per-package drill-downs"
    cmds:
      - bash scripts/build-graph-pages.sh

  clean:
    desc: "Remove build artifacts and caches"
    cmds:
      - rm -rf dist/ .task/ .pytest_cache/ .ruff_cache/
      - rm -rf **/dist/ **/.pytest_cache/ **/__pycache__/
      - rm -rf node_modules/.cache/
      - rm -rf graphify-out/
